<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ratu Ngemil by ADILA</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta name="theme-color" content="#FCB001">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--y:#FCB001;--g:#228b22;--soft:#fff6dd;--tx:#2b2113;--mu:#7a6a4f;--ln:#f0e2b8;--r:16px}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:#fff;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:var(--y);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:44px;background:#fff;border-radius:10px;padding:2px}
header b{font-size:18px}
main{max-width:980px;margin:auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--y);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font:600 10px inherit;color:var(--mu);min-height:56px}
nav button.on{color:#000;background:var(--soft);box-shadow:inset 0 3px var(--y)}
nav i{display:block;font-style:normal;font-size:20px}
h3{margin-bottom:6px;font-size:17px}
.card{border:1.5px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;height:48px;border:1.5px solid var(--ln);border-radius:12px;padding:0 12px;font:inherit;background:#fff}
input[type=file]{padding-top:11px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--y)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--g);color:#fff;font:700 17px inherit;margin-top:12px}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.red{background:#c62828}
.btn.sm{width:auto;min-height:40px;padding:0 12px;font-size:14px;margin:2px 0}
.chips{display:flex;gap:8px}
.chips button{flex:1;min-height:48px;border:2px solid var(--y);border-radius:12px;background:#fff;font:700 14px inherit}
.chips .on{background:var(--y)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:6px}
.tile{border:1.5px solid var(--ln);border-radius:12px;background:#fff;padding:6px;font:inherit;text-align:center}
.tile img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft)}
.ph{display:flex;align-items:center;justify-content:center;font-size:30px}
.tile span{display:block;font-size:12px;font-weight:700;line-height:1.2}
.tile small{color:var(--g);font-weight:700}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.li button{width:40px;height:40px;border:0;border-radius:10px;background:var(--soft);font:700 20px inherit;flex:none}.li .pl{background:var(--g);color:#fff}.q{display:flex;align-items:center}.q b{min-width:30px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:8px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--soft);border-radius:var(--r);padding:12px}
.kpi:first-child{grid-column:1/-1}
.kpi small,.mu{color:var(--mu)}.kpi b{display:block;font-size:22px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--y);text-align:left}td,th{padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}
.hb{display:grid;grid-template-columns:104px 1fr 48px;gap:6px;align-items:center;font-size:13px;margin:6px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{background:var(--soft);border-radius:6px;height:14px}.bar i{display:block;height:100%;background:var(--y);border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:1px;height:150px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;font-size:8px;letter-spacing:-.4px;text-align:center;min-width:0}
.cols i{background:var(--y);border-radius:3px 3px 0 0;display:block}
.g{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
.xr{border-bottom:1px solid var(--ln);padding-bottom:10px;margin-bottom:6px}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ins .card{margin:0;background:var(--soft);border:0}.ins b{display:block;font-size:17px}
#m{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center}
#m.on{display:flex}
#m>div{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.rc{font:13px/1.5 ui-monospace,Menlo,monospace;text-align:center;border:1.5px dashed var(--mu);padding:12px;border-radius:10px;margin:8px 0}
.rc img{height:76px}.rc .l{display:flex;justify-content:space-between;text-align:left;gap:8px}
</style>
</head>
<body>
<header><img src="logo.jpg" alt="Ratu Ngemil"><b>RATU NGEMIL by ADILA</b></header>
<main id="v"></main>
<nav id="nv"></nav>
<div id="m"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Penyimpanan penuh. Hapus foto produk yang besar.')}};
let P=[],T=[],B=[],X=[],role='',busy=0,cart=[],type='REGULER',pm='CASH',page='kasir',ed=null,ph='';
const day=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>day(Date.now()),sum=a=>a.reduce((s,x)=>s+x.total,0),inR=(t,a,b)=>t.ts>=a&&t.ts<b;
const wk=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return +d};
const mo=(o=0)=>{const d=new Date();return +new Date(d.getFullYear(),d.getMonth()+o,1)};
const qty=a=>{const m={};a.forEach(t=>t.items.forEach(i=>m[i.name]=(m[i.name]||0)+i.qty));return m};
const rank=(m,asc)=>{const r=P.map(p=>[p.name,m[p.name]||0]);Object.keys(m).forEach(n=>{if(!asc&&!P.some(p=>p.name==n))r.push([n,m[n]])});return r.sort((a,b)=>asc?a[1]-b[1]:b[1]-a[1])};
const FEE={REGULER:0,GRAB:.2,SHOPEE:.25},sug=(p,f)=>Math.ceil(p/(1-f)/500)*500,px=(p,t)=>t=='GRAB'?(p.pg||sug(p.price,.2)):t=='SHOPEE'?(p.ps||sug(p.price,.25)):p.price,nt=t=>t.net!=null?t.net:t.total,payOf=t=>t.pay||(t.type=='REGULER'?'CASH':'APLIKASI'),sumN=a=>a.reduce((s,x)=>s+nt(x),0);
const D=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const hb=(rows,f=x=>x)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.length?rows.map(r=>`<div class=hb><span>${esc(r[0])}</span><div class=bar><i style="width:${r[1]/mx*100}%"></i></div><b>${f(r[1])}</b></div>`).join(''):'<p class=mu>Belum ada data.</p>'};
const cols=(v,l)=>{const mx=Math.max(1,...v);return `<div class=cols>${v.map((x,i)=>`<div title="${l[i]}: ${x}"><i style="height:${x/mx*100}%;min-height:${x?2:0}px"></i>${l[i]}</div>`).join('')}</div>`};
const im=(p,s)=>p.photo?`<img src="${p.photo}" alt="" ${s?`style="width:${s}px;height:${s}px;border-radius:8px;object-fit:cover"`:''}>`:`<div class=ph ${s?`style="width:${s}px;height:${s}px;font-size:${s/2}px"`:''}>🍿</div>`;
const modal=h=>{$('#m').innerHTML='<div>'+h+'</div>';$('#m').classList.add('on')},cm=()=>$('#m').classList.remove('on');
const fmt=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ADDR='Jl. Poros Malino (Depan UPL PLN), Mawang, Kab. Gowa',TELP='0823-4698-1474';

/* ---------- STRUK ---------- */
const rtext=t=>`*RATU NGEMIL*\n${ADDR}\n--------------------\n${new Date(t.ts).toLocaleString('id-ID')} (${t.type})\n${t.items.map(i=>`${i.qty}x ${i.name} @${rp(i.price)} = ${rp(i.qty*i.price)}`).join('\n')}\n--------------------\n${t.disc?`Diskon: -${rp(t.disc)}\n`:''}Total: ${rp(t.total)}\nBayar: ${rp(t.paid)}\nKembali: ${rp(t.change)}\n--------------------\nTerima kasih sudah memesan produk kami\nKritik, Saran, & Info Pemesanan, Hubungi : ${TELP}`;
const rhtml=t=>`<div class=rc><img src="logo.jpg" alt=""><br><b>RATU NGEMIL</b><br>${ADDR}<hr>${fmt(t.ts)} · ${t.type}<hr>${t.items.map(i=>`<div class=l><span>${i.qty}× ${esc(i.name)}</span><span>${rp(i.qty*i.price)}</span></div>`).join('')}<hr>${t.disc?`<div class=l><span>Diskon</span><span>-${rp(t.disc)}</span></div>`:''}<div class=l><b>Total</b><b>${rp(t.total)}</b></div><div class=l><span>Bayar</span><span>${rp(t.paid)}</span></div><div class=l><span>Kembali</span><span>${rp(t.change)}</span></div><hr>Terima kasih sudah memesan produk kami<br>Kritik, Saran, &amp; Info Pemesanan, Hubungi : ${TELP}</div>`;
function ask(id){modal(`<h3>Kirim Struk Pembelian?</h3><div class=row><button class="btn sec" onclick=cm()>Tidak</button><button class=btn onclick=wa(${id})>Ya</button></div>`)}
function wa(id){const t=T.find(x=>x.id==id);modal(`<h3>Kirim Struk</h3>${rhtml(t)}<label>Nomor WhatsApp pelanggan</label><input id=wn type=tel inputmode=tel placeholder="08xxxxxxxxxx"><button class=btn onclick=send(${id})>Kirim</button><button class="btn sec" onclick=cm()>Batal</button>`)}
function send(id){let n=$('#wn').value.replace(/\D/g,'');if(n[0]=='0')n='62'+n.slice(1);else if(n[0]=='8')n='62'+n;if(n.length<10)return alert('Nomor WhatsApp belum benar.');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(rtext(T.find(x=>x.id==id))),'_blank');cm()}

/* ---------- KASIR ---------- */
const total=()=>cart.reduce((s,i)=>s+i.qty*i.price,0);
const dsc=()=>{const e=$('#disc');return type=='REGULER'||!e?0:Math.min(Math.max(0,+e.value||0),total())},due=()=>total()-dsc();
function txTable(l,act){return l.length?`<div class=tw><table><tr><th>${act?'Waktu':'Jam'}<th>Rincian<th>Jenis<th>Total${act&&role=='kasir'?'<th>Aksi':''}</tr>${l.map(t=>`<tr><td>${act?fmt(t.ts):new Date(t.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<td>${t.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}<td>${t.type}${t.type=='REGULER'?`<br><small class=mu>${payOf(t)}</small>`:''}<td>${rp(t.total)}${t.disc?`<br><small class=mu>Diskon −${rp(t.disc)}</small>`:''}${t.fee?`<br><small class=mu>Diterima ${rp(nt(t))}</small>`:''}${act&&role=='kasir'?`<td><button class="btn sm sec" onclick=wa(${t.id})>Struk</button> <button class="btn sm sec" onclick=edt(${t.id})>Edit</button> <button class="btn sm red" onclick=dlt(${t.id})>Hapus</button>`:''}</tr>`).join('')}</table></div>`:'<p class=mu>Belum ada transaksi.</p>'}
function kasir(){const tt=T.filter(t=>day(t.ts)==today()).sort((a,b)=>b.ts-a.ts);
return `<div class=card><h3>Input Penjualan</h3><div id=tiles></div>
<label>Nama produk</label><input id=pn oninput=pick() placeholder="Cari atau ketik nama produk" autocomplete=off onkeydown="if(event.key=='Enter')enter()">
</div>
<div class=card><h3>Pesanan</h3><div id=cart></div>
<label>Jenis transaksi</label><div class=chips id=tc>${['REGULER','GRAB','SHOPEE'].map(x=>`<button class="${x==type?'on':''}" onclick="setType('${x}')">${x}</button>`).join('')}</div>
<div id=discbox><label>Diskon (Rp)</label><input id=disc type=number inputmode=numeric oninput=drawCart() placeholder="0"></div><div id=pmbox><label>Metode pembayaran</label><div class=chips id=pc>${['CASH','QRIS'].map(x=>`<button class="${x==pm?'on':''}" onclick="setPm('${x}')">${x}</button>`).join('')}</div></div><div id=cashbox><label>Jumlah bayar</label><input id=pay type=number inputmode=numeric oninput=calc() placeholder="0">
<label>Kembalian</label><input id=chg readonly value="Rp0"></div><button class=btn onclick=bayar()>BAYAR</button></div>
<div class=card><h3>Transaksi Hari Ini</h3>${txTable(tt,0)}</div>`}
function setType(x){type=x;document.querySelectorAll('#tc button').forEach(b=>b.classList.toggle('on',b.textContent==x));cart.forEach(i=>{const p=P.find(q=>q.id==i.pid)||find(i.name);if(p)i.price=px(p,x)});if(x=='REGULER')$('#disc').value='';drawCart();drawTiles();ui()}
function setPm(x){pm=x;document.querySelectorAll('#pc button').forEach(b=>b.classList.toggle('on',b.textContent==x));ui()}
function ui(){$('#pmbox').style.display=type=='REGULER'?'':'none';$('#cashbox').style.display=type=='REGULER'&&pm=='CASH'?'':'none';$('#discbox').style.display=type=='REGULER'?'none':''}
const find=n=>P.find(p=>p.name.toLowerCase()==String(n).trim().toLowerCase());
function matches(){const s=($('#pn').value||'').trim().toLowerCase();return s?P.filter(p=>p.name.toLowerCase().includes(s)):[]}
function drawTiles(){const s=($('#pn').value||'').trim(),q=qty(T.filter(t=>t.ts>=Date.now()-30*864e5));if(!P.length){$('#tiles').innerHTML='<p class=mu>Master Data masih kosong. Tambahkan produk dulu di tab Master Data.</p>';return}
const l=s?matches():[...P].sort((a,b)=>(q[b.name]||0)-(q[a.name]||0)).slice(0,3);
$('#tiles').innerHTML=l.length?`<div class=tiles>${l.map(p=>`<button class=tile onclick="quick(${p.id})">${im(p)}<span>${esc(p.name)}</span><small>${rp(px(p,type))}</small></button>`).join('')}</div>`+(!s&&P.length>l.length?`<p class=mu>Menampilkan ${l.length} produk terlaris. Ketik nama untuk mencari produk lain.</p>`:''):'<p class=mu>Produk tidak ditemukan.</p>'}
function pick(){drawTiles()}
function enter(){const m=matches();if(m.length==1)quick(m[0].id)}
function push(p,q){const c=cart.find(i=>i.name==p.name);c?c.qty+=q:cart.push({pid:p.id,name:p.name,price:px(p,type),qty:q});drawCart()}
function quick(id){push(P.find(p=>p.id==id),1);$('#pn').value='';drawTiles()}
function drawCart(){$('#cart').innerHTML=cart.length?cart.map((i,k)=>`<div class=li><div style="flex:1;min-width:0"><div style="font-weight:600;line-height:1.2">${esc(i.name)}</div><small class=mu>${rp(i.qty*i.price)}</small></div><div class=q><button onclick=chg(${k},-1)>−</button><b>${i.qty}</b><button class=pl onclick=chg(${k},1)>+</button></div></div>`).join('')+`${dsc()?`<div class=g><span>Subtotal</span><span>${rp(total())}</span></div><div class=g style="color:#c62828"><span>Diskon</span><span>−${rp(dsc())}</span></div>`:''}<div class=tot><span>Total</span><span>${rp(due())}</span></div>${FEE[type]?`<p class=mu>Harga ${type}. Potongan ${Math.round(FEE[type]*100)}% (${rp(due()*FEE[type])}), uang diterima <b>${rp(due()*(1-FEE[type]))}</b></p>`:''}`:'<p class=mu>Belum ada item. Pilih produk di atas.</p>';calc()}
function del(k){cart.splice(k,1);drawCart()}
function chg(k,d){cart[k].qty+=d;if(cart[k].qty<1)cart.splice(k,1);drawCart()}
function calc(){const d=(+$('#pay').value||0)-due();$('#chg').value=d>=0?rp(d):'Kurang '+rp(-d)}
async function bayar(){if(busy)return;if(!cart.length)return alert('Pesanan masih kosong.');const sub=total(),dc=dsc(),t=sub-dc;const cash=type=='REGULER'&&pm=='CASH';let p=cash?+$('#pay').value:t;if(p<t)return alert('Jumlah bayar kurang.');const fee=FEE[type],tx={id:Date.now(),ts:Date.now(),type,pay:type=='REGULER'?pm:'APLIKASI',items:cart,sub,disc:dc,total:t,fee,net:Math.round(t*(1-fee)),paid:p,change:p-t};busy=1;try{await api('puttx',{tx})}catch(e){busy=0;return alert('Gagal menyimpan. Cek koneksi internet.')}busy=0;T.push(tx);cart=[];pm='CASH';render();ask(tx.id)}

/* ---------- DASHBOARD ---------- */
let mf=today().slice(0,7);
const mR=(o=0)=>{const[y,m]=mf.split('-').map(Number);return[+new Date(y,m-1+o,1),+new Date(y,m+o,1)]};
const ml=()=>{const[y,m]=mf.split('-').map(Number);return mf==today().slice(0,7)?'Bulan Ini':new Date(y,m-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
const mfIn=()=>`<div class=card><label style="margin:0 0 4px">Pilih bulan (berlaku untuk semua grafik)</label><input type=month value="${mf}" onchange="if(this.value){mf=this.value;render()}"></div>`;
const dl=n=>Array.from({length:n},(_,i)=>String(i+1)),f2=n=>String(+Number(n).toFixed(2)).replace('.',',');
const bsum=a=>{const o={};a.forEach(x=>{const r=o[x.name]||(o[x.name]={q:0,h:0,u:x.unit});r.q+=x.qty;r.h+=x.price});return Object.entries(o)};
function dash(){const[a,b]=mR(),[y,m]=mf.split('-').map(Number),dim=new Date(y,m,0).getDate(),td=T.filter(t=>day(t.ts)==today()),cs=td.filter(t=>payOf(t)=='CASH'),qr=td.filter(t=>payOf(t)=='QRIS'),ap=td.filter(t=>payOf(t)=='APLIKASI'),mt=T.filter(t=>inR(t,a,b)),mx=X.filter(x=>x.ts>=a&&x.ts<b),dv=Array(dim).fill(0),ev=Array(dim).fill(0),jt={},q=qty(mt),bl=bsum(mx).sort((p,r)=>r[1].h-p[1].h).slice(0,10),cm=k=>rp(sumN(mt.filter(t=>payOf(t)==k)));
mt.forEach(t=>{dv[new Date(t.ts).getDate()-1]+=nt(t);jt[t.type]=(jt[t.type]||0)+nt(t)});mx.forEach(x=>ev[new Date(x.ts).getDate()-1]+=x.price);
return `<div class=kpis><div class=kpi><small>Pendapatan Hari Ini (diterima)</small><b>${rp(sumN(td))}</b><small>Nilai pesanan ${rp(sum(td))} · Potongan aplikasi ${rp(sum(td)-sumN(td))}</small></div><div class=kpi><small>Transaksi Hari Ini</small><b>${td.length}</b></div><div class=kpi><small>Rata-rata per transaksi</small><b>${rp(td.length?sumN(td)/td.length:0)}</b></div><div class=kpi><small>Pendapatan Cash</small><b>${rp(sumN(cs))}</b><small>${ml()}: ${cm('CASH')}</small></div><div class=kpi><small>Pendapatan QRIS</small><b>${rp(sumN(qr))}</b><small>${ml()}: ${cm('QRIS')}</small></div></div><p class=mu style="margin-top:8px;font-size:13px">Via aplikasi hari ini (Grab/Shopee, diterima): ${rp(sumN(ap))}</p><br>${mfIn()}
<div class=card><h3>Trend Pendapatan Harian (${ml()})</h3>${cols(dv,dl(dim))}<p class=mu>Total (diterima): ${rp(sumN(mt))}</p></div>
<div class=card><h3>Grafik Pengeluaran Harian (${ml()})</h3>${cols(ev,dl(dim))}<p class=mu>Total pengeluaran: ${rp(ev.reduce((s,x)=>s+x,0))}</p></div>
<div class=card><h3>Pembelian Bahan Terbanyak (${ml()})</h3>${bl.length?bl.map(([n,o])=>`<div class=g><span>${esc(n)}</span><span><b>${f2(o.q)} ${esc(o.u)}</b> · ${rp(o.h)}</span></div>`).join(''):'<p class=mu>Belum ada data pengeluaran.</p>'}</div>
<div class=card><h3>TOP 10 Terlaris ${ml()}</h3>${hb(rank(q).slice(0,10).filter(r=>r[1]>0))}</div>
<div class=card><h3>TOP 10 Penjualan Terendah ${ml()}</h3>${hb(rank(q,1).slice(0,10))}</div>
<div class=card><h3>Pendapatan per Jenis Transaksi (${ml()})</h3>${hb(Object.entries(jt),x=>Math.round(x/1000)+'rb')}</div>`}

/* ---------- PENGELUARAN ---------- */
let xf=day(Date.now()-30*864e5),xt=today(),xlim=20,xd=today(),XR=[{n:'',q:'',h:''}];
const fb=n=>B.find(x=>x.name.toLowerCase()==String(n).trim().toLowerCase()),num=v=>parseFloat(String(v).replace(',','.'))||0;
function rr(){XR=XR.map((r,i)=>{const n=$('#xn'+i);return n?{n:n.value,q:$('#xq'+i).value,h:$('#xh'+i).value}:r});const d=$('#xd');if(d&&d.value)xd=d.value}
function xu(i){const x=fb($('#xn'+i).value);$('#xs'+i).value=x?x.unit:''}
function xadd(){rr();XR.push({n:'',q:'',h:''});render()}
function xrm(i){rr();XR.splice(i,1);render()}
async function xsave(){if(busy)return;rr();const rows=XR.filter(r=>r.n||r.q||r.h);if(!rows.length)return alert('Isi data pengeluaran dulu.');const t0=+new Date(xd+'T'+new Date().toTimeString().slice(0,8)),xs=[];
for(let i=0;i<rows.length;i++){const r=rows[i],bb=fb(r.n),q=num(r.q),h=+r.h;if(!bb)return alert('Bahan "'+r.n+'" belum ada di Master Data.');if(!(q>0)||!(h>0))return alert('Qty dan harga untuk "'+r.n+'" harus diisi.');xs.push({id:Date.now()+i,ts:t0+i,name:bb.name,unit:bb.unit,qty:q,price:h})}
busy=1;try{await api('putxs',{xs})}catch(e){busy=0;return alert('Gagal menyimpan. Cek koneksi internet.')}busy=0;X.push(...xs);XR=[{n:'',q:'',h:''}];render()}
function xdl(id){if(confirm('Hapus catatan pengeluaran ini?')){rr();X=X.filter(x=>x.id!=id);api('delx',{id}).catch(()=>alert('Gagal menghapus.'));render()}}
function peng(){const a=+new Date(xf+'T00:00'),b=+new Date(xt+'T23:59:59'),l=X.filter(x=>x.ts>=a&&x.ts<=b).sort((p,q)=>q.ts-p.ts),sh=l.slice(0,xlim);
return `<div class=card><h3>Input Pengeluaran</h3><label>Tanggal</label><input id=xd type=date value="${xd}"><datalist id=bl>${B.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>${XR.map((r,i)=>{const bb=fb(r.n);return `<div class=xr><label>Nama bahan</label><input id=xn${i} list=bl value="${esc(r.n)}" oninput=xu(${i}) autocomplete=off placeholder="Ketik nama bahan"><div class=row><div><label>Qty</label><input id=xq${i} inputmode=decimal value="${esc(r.q)}" oninput="this.value=this.value.replace(/[^0-9.,]/g,'')"></div><div><label>Satuan</label><input id=xs${i} readonly value="${bb?esc(bb.unit):''}"></div><div><label>Harga (Rp)</label><input id=xh${i} inputmode=numeric value="${esc(r.h)}" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div></div>${XR.length>1?`<button class="btn sm red" onclick=xrm(${i})>Hapus baris</button>`:''}</div>`}).join('')}<button class="btn sec" onclick=xadd()>+ Tambah</button><button class=btn onclick=xsave()>Input</button></div>
<div class=card><h3>Riwayat Pengeluaran</h3><div class=row><div><label>Dari</label><input type=date value="${xf}" onchange="if(this.value){rr();xf=this.value;xlim=20;render()}"></div><div><label>Sampai</label><input type=date value="${xt}" onchange="if(this.value){rr();xt=this.value;xlim=20;render()}"></div></div><p style="margin:10px 0"><b>${l.length}</b> catatan · total <b>${rp(l.reduce((s,x)=>s+x.price,0))}</b></p>${sh.length?`<div class=tw><table><tr><th>Tanggal<th>Bahan<th>Qty<th>Harga<th></tr>${sh.map(x=>`<tr><td>${fmt(x.ts)}<td>${esc(x.name)}<td>${f2(x.qty)} ${esc(x.unit)}<td>${rp(x.price)}<td><button class="btn sm red" onclick=xdl(${x.id})>Hapus</button></tr>`).join('')}</table></div>`+(l.length>xlim?`<button class="btn sec" onclick="rr();xlim+=20;render()">Tampilkan lebih banyak (${l.length-xlim} lagi)</button>`:''):'<p class=mu>Belum ada pengeluaran pada rentang ini.</p>'}</div>`}

/* ---------- RIWAYAT ---------- */
let rf=day(mo()),rt=today();
function riw(){const a=+new Date(rf+'T00:00'),b=+new Date(rt+'T23:59:59'),l=T.filter(t=>t.ts>=a&&t.ts<=b).sort((x,y)=>y.ts-x.ts);
return `<div class=card><h3>Riwayat Transaksi</h3><div class=row><div><label>Dari</label><input type=date value="${rf}" onchange="if(this.value){rf=this.value;render()}"></div><div><label>Sampai</label><input type=date value="${rt}" onchange="if(this.value){rt=this.value;render()}"></div></div><p style="margin:10px 0"><b>${l.length}</b> transaksi · diterima <b>${rp(sumN(l))}</b> (nilai pesanan ${rp(sum(l))})</p>${txTable(l,1)}</div>`}
function edt(id){const t=T.find(x=>x.id==id);modal(`<h3>Edit Transaksi</h3><label>Jenis transaksi</label><select id=et>${['REGULER','GRAB','SHOPEE'].map(x=>`<option ${x==t.type?'selected':''}>${x}</option>`).join('')}</select><label>Metode pembayaran (untuk REGULER)</label><select id=em>${['CASH','QRIS'].map(x=>`<option ${x==payOf(t)?'selected':''}>${x}</option>`).join('')}</select>${t.items.map((i,k)=>`<label>${esc(i.name)} (${rp(i.price)}): jumlah, 0 untuk hapus item</label><input type=number inputmode=numeric id=eq${k} value=${i.qty}>`).join('')}<label>Diskon (Rp, hanya GRAB/SHOPEE)</label><input type=number inputmode=numeric id=edc value=${t.disc||0}><label>Jumlah bayar</label><input type=number inputmode=numeric id=ep value=${t.paid}><button class=btn onclick=sve(${id})>Simpan perubahan</button><button class="btn sec" onclick=cm()>Batal</button>`)}
function sve(id){const t=T.find(x=>x.id==id);const ot=t.type;t.type=$('#et').value;t.fee=FEE[t.type];t.pay=t.type=='REGULER'?$('#em').value:'APLIKASI';t.items.forEach((i,k)=>i.qty=+$('#eq'+k).value||0);t.items=t.items.filter(i=>i.qty>0);if(!t.items.length)return alert('Minimal 1 item. Untuk menghapus transaksi, pakai tombol Hapus.');if(t.type!=ot)t.items.forEach(i=>{const p=find(i.name);if(p)i.price=px(p,t.type)});t.sub=t.items.reduce((s,i)=>s+i.qty*i.price,0);t.disc=t.type=='REGULER'?0:Math.min(+$('#edc').value||0,t.sub);t.total=t.sub-t.disc;t.net=Math.round(t.total*(1-t.fee));t.paid=+$('#ep').value||t.total;t.change=Math.max(0,t.paid-t.total);api('puttx',{tx:t}).catch(()=>alert('Gagal menyimpan perubahan.'));cm();render()}
function dlt(id){if(confirm('Hapus transaksi ini?')){T=T.filter(x=>x.id!=id);api('deltx',{id}).catch(()=>alert('Gagal menghapus.'));render()}}

/* ---------- SUMMARY ---------- */
function summ(){const[a,b]=mR(),[a0]=mR(-1),[y,m]=mf.split('-').map(Number),dim=new Date(y,m,0).getDate(),cur=T.filter(t=>inR(t,a,b)),prv=T.filter(t=>inR(t,a0,a)),mx=X.filter(x=>x.ts>=a&&x.ts<b),pv=X.filter(x=>x.ts>=a0&&x.ts<a);
if(!cur.length&&!mx.length)return mfIn()+`<div class=card><p class=mu>Belum ada transaksi atau pengeluaran pada ${ml()}.</p></div>`;
const qc=qty(cur),qp=qty(prv),hr=Array(24).fill(0),dw=Array(7).fill(0);cur.forEach(t=>{const d=new Date(t.ts);hr[d.getHours()]++;dw[d.getDay()]++});
const tp=rank(qc)[0],h=hr.indexOf(Math.max(...hr)),pd=dw.indexOf(Math.max(...dw)),o1=sumN(cur),o0=sumN(prv),e1=mx.reduce((s,x)=>s+x.price,0),e0=pv.reduce((s,x)=>s+x.price,0),dd=mf==today().slice(0,7)?new Date().getDate():dim;
const gr=Object.keys(qc).filter(n=>qp[n]).map(n=>[n,Math.round((qc[n]-qp[n])/qp[n]*100)]).sort((p,q)=>q[1]-p[1]);
const be=bsum(mx),bh=[...be].sort((p,q)=>q[1].h-p[1].h),bq=[...be].sort((p,q)=>q[1].q-p[1].q)[0];
const pc=(x,y)=>y?` (${x>=y?'▲':'▼'} ${Math.abs(Math.round((x-y)/y*100))}% dari bulan lalu)`:'';
const c=(t,v)=>`<div class=card><small class=mu>${t}</small><b>${v}</b></div>`,N=cur.length;
return mfIn()+`<div class=ins>${c('🏆 Terlaris',tp&&tp[1]?`${esc(tp[0])} (${tp[1]} terjual)`:'-')}${c('💰 Pendapatan (diterima)',rp(o1)+pc(o1,o0))}${c('🏷️ Potongan Grab/Shopee',rp(sum(cur)-o1)+(sum(cur)?` (${Math.round((sum(cur)-o1)/sum(cur)*100)}% dari nilai pesanan)`:''))}${c('🎁 Diskon promo',rp(cur.reduce((s,t)=>s+(t.disc||0),0)))}${c('🧾 Rata-rata belanja',N?rp(o1/N):'-')}${c('⏰ Jam paling ramai',N?`${h}:00 sampai ${h+1}:00 (${hr[h]} transaksi)`:'-')}${c('📅 Hari paling ramai',N?D[pd]:'-')}${c('💸 Total pengeluaran',rp(e1)+pc(e1,e0))}${c('🛒 Pengeluaran tertinggi',bh[0]?`${esc(bh[0][0])} (${rp(bh[0][1].h)})`:'-')}${c('📦 Bahan paling banyak dibeli',bq?`${esc(bq[0])} (${f2(bq[1].q)} ${esc(bq[1].u)})`:'-')}${c('📈 Pendapatan dikurangi pengeluaran',rp(o1-e1)+(o1?` (pengeluaran ${Math.round(e1/o1*100)}% dari pendapatan)`:''))}${c('📆 Rata-rata pengeluaran per hari',rp(e1/dd))}</div><br>
<div class=card><h3>Jumlah transaksi per hari</h3>${hb(D.map((d,i)=>[d,dw[i]]))}</div>
<div class=card><h3>Pengeluaran per bahan</h3>${hb(bh.slice(0,10).map(([n,o])=>[n,o.h]),x=>Math.round(x/1000)+'rb')}</div>
<div class=card><h3>Perubahan penjualan produk vs bulan lalu</h3>${gr.length?gr.map(([n,p])=>`<div class=g><span>${esc(n)}</span><b style="color:${p>=0?'#228b22':'#c62828'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</b></div>`).join(''):'<p class=mu>Perlu data bulan lalu untuk perbandingan.</p>'}</div>`}

/* ---------- MASTER DATA ---------- */
function mast0(){const e=P.find(p=>p.id==ed);return `<div class=card><h3>${e?'Edit':'Tambah'} Produk</h3><label>Nama produk</label><input id=mn value="${e?esc(e.name):''}"><div class=row><div><label>Harga Reguler</label><input id=mp type=number inputmode=numeric oninput=hint() value="${e?e.price:''}"></div><div><label>Harga Grab</label><input id=mg type=number inputmode=numeric value="${e&&e.pg?e.pg:''}"></div><div><label>Harga Shopee</label><input id=ms type=number inputmode=numeric value="${e&&e.ps?e.ps:''}"></div></div><p class=mu style="font-size:12px;margin-top:4px">Kosongkan harga Grab atau Shopee untuk diisi otomatis (potongan Grab 20%, Shopee 25%).</p><label>Foto produk${e?' (kosongkan jika tidak diganti)':''}</label><input type=file accept="image/*" onchange=foto(this)><div id=prev></div><button class=btn onclick=simpan()>Simpan</button>${e?'<button class="btn sec" onclick=batal()>Batal</button>':''}</div>
<div class=card><h3>Daftar Produk (${P.length})</h3>${P.length?`<div class=tw><table><tr><th>Foto<th>Nama<th>Harga<th>Aksi</tr>${P.map(p=>`<tr><td>${im(p,48)}<td>${esc(p.name)}<td>${rp(p.price)}<br><small class=mu>Grab ${rp(px(p,'GRAB'))}<br>Shopee ${rp(px(p,'SHOPEE'))}</small><td><button class="btn sm sec" onclick=eP(${p.id})>Edit</button> <button class="btn sm red" onclick=dP(${p.id})>Hapus</button></tr>`).join('')}</table></div>`:'<p class=mu>Belum ada produk.</p>'}</div>`}
function foto(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const g=new Image();g.onload=()=>{const s=Math.min(1,240/Math.max(g.width,g.height)),c=document.createElement('canvas');c.width=g.width*s;c.height=g.height*s;c.getContext('2d').drawImage(g,0,0,c.width,c.height);ph=c.toDataURL('image/jpeg',.75);$('#prev').innerHTML=`<img src="${ph}" height=80 alt="">`};g.src=r.result};r.readAsDataURL(f)}
function simpan(){const n=$('#mn').value.trim(),pr=+$('#mp').value;if(!n||!(pr>0))return alert('Isi nama dan harga produk.');if(P.some(p=>p.id!=ed&&p.name.toLowerCase()==n.toLowerCase()))return alert('Nama produk sudah ada.');const e=P.find(p=>p.id==ed);const pg=+$('#mg').value||sug(pr,.2),ps=+$('#ms').value||sug(pr,.25);if(e){e.name=n;e.price=pr;e.pg=pg;e.ps=ps;if(ph)e.photo=ph}else P.push({id:Date.now(),name:n,price:pr,pg,ps,photo:ph});api('putp',{p:P}).catch(()=>alert('Gagal menyimpan produk.'));ed=null;ph='';render()}
function hint(){const v=+$('#mp').value;$('#mg').placeholder=v?rp(sug(v,.2)):'Otomatis';$('#ms').placeholder=v?rp(sug(v,.25)):'Otomatis'}
function batal(){ed=null;ph='';render()}
function eP(id){ed=id;ph='';render();scrollTo(0,0)}
function dP(id){if(confirm('Hapus produk ini? Riwayat transaksi lama tidak berubah.')){P=P.filter(p=>p.id!=id);api('putp',{p:P}).catch(()=>alert('Gagal menyimpan produk.'));render()}}

let eb=null;
function mast(){return mast0()+mastB()}
function mastB(){const e=B.find(x=>x.id==eb);return `<div class=card id=bform><h3>${e?'Edit':'Tambah'} Bahan</h3><label>Nama bahan</label><input id=bnm value="${e?esc(e.name):''}"><label>Satuan</label><input id=bun list=ul value="${e?esc(e.unit):''}" placeholder="kg, liter, pcs..."><datalist id=ul>${['kg','gram','liter','ml','pcs','pak','butir','ikat','dus'].map(u=>`<option value="${u}">`).join('')}</datalist><button class=btn onclick=simpanB()>Simpan</button>${e?'<button class="btn sec" onclick="eb=null;render()">Batal</button>':''}</div>
<div class=card><h3>Daftar Bahan (${B.length})</h3>${B.length?`<div class=tw><table><tr><th>Nama<th>Satuan<th>Aksi</tr>${B.map(x=>`<tr><td>${esc(x.name)}<td>${esc(x.unit)}<td><button class="btn sm sec" onclick=eB(${x.id})>Edit</button> <button class="btn sm red" onclick=dB(${x.id})>Hapus</button></tr>`).join('')}</table></div>`:'<p class=mu>Belum ada bahan.</p>'}</div>`}
function simpanB(){const n=$('#bnm').value.trim(),u=$('#bun').value.trim();if(!n||!u)return alert('Isi nama bahan dan satuan.');if(B.some(x=>x.id!=eb&&x.name.toLowerCase()==n.toLowerCase()))return alert('Nama bahan sudah ada.');const e=B.find(x=>x.id==eb);if(e){e.name=n;e.unit=u}else B.push({id:Date.now(),name:n,unit:u});api('putb',{b:B}).catch(()=>alert('Gagal menyimpan bahan.'));eb=null;render()}
function eB(id){eb=id;render();$('#bform').scrollIntoView()}
function dB(id){if(confirm('Hapus bahan ini? Riwayat pengeluaran lama tidak berubah.')){B=B.filter(x=>x.id!=id);api('putb',{b:B}).catch(()=>alert('Gagal menyimpan bahan.'));render()}}

/* ---------- APP ---------- */
const pages={kasir,dashboard:dash,peng:peng,riwayat:riw,summary:summ,master:mast},tabs=[['kasir','🧾','KASIR'],['dashboard','📊','Dashboard'],['peng','💸','Pengeluaran'],['riwayat','🕘','Riwayat'],['summary','💡','Summary'],['master','📦','Master Data']];
function go(p){page=p;render();scrollTo(0,0)}
function render(){$('#v').innerHTML=pages[page]();$('#nv').innerHTML=tabs.filter(t=>role=='kasir'||!['kasir','master'].includes(t[0])).map(t=>`<button class="${t[0]==page?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');if(page=='kasir'){drawCart();drawTiles();ui()}if(page=='master')hint()}
$('#m').addEventListener('click',e=>{if(e.target.id=='m')cm()});
const api=async(a,b={})=>{const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,pin:localStorage.getItem('rn_pin'),...b})});if(r.status==401){const e=new Error('401');e.auth=1;throw e}if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,150))}return r.json()};
function loginUI(m=''){$('#nv').innerHTML='';$('#v').innerHTML=`<div class=card><h3>Masuk</h3><p class=mu>${m}</p><label>PIN</label><input id=pin type=password inputmode=numeric autocomplete=current-password><button class=btn onclick=login()>Masuk</button></div>`}
function login(){localStorage.setItem('rn_pin',$('#pin').value.trim());boot()}
function logout(){localStorage.removeItem('rn_pin');role='';loginUI()}
async function boot(){$('#v').innerHTML='<p class=mu>Memuat data...</p>';try{const d=await api('load');role=d.role;P=d.p;T=d.t;B=d.b||[];X=d.x||[];if(role=='kasir'&&!P.length&&!T.length){const lp=L('rn_p'),lt=L('rn_t');if((lp.length||lt.length)&&confirm('Ada data lama di browser ini. Impor ke database?')){await api('import',{p:lp,t:lt});const e=await api('load');P=e.p;T=e.t;B=e.b||[];X=e.x||[]}}page=role=='kasir'?'kasir':'dashboard';render()}catch(e){if(e.auth)loginUI('PIN salah. Coba lagi.');else $('#v').innerHTML=`<div class=card><p>Gagal memuat data.</p><p class=mu>Detail: ${esc(e.message)}</p><button class=btn onclick=boot()>Coba lagi</button></div>`}}
setInterval(async()=>{if(role=='pantau'&&document.visibilityState=='visible'&&!$('#m').classList.contains('on'))try{const d=await api('load');P=d.p;T=d.t;B=d.b||[];X=d.x||[];render()}catch(e){}},30000);
boot();
</script>
